name: Update contribution animation

on:
  schedule:
    - cron: "17 8 * * *"   # once a day
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: [scripts/contrib-svg.js, .github/workflows/contrib.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw contribution SVG
        run: node scripts/contrib-svg.js assets/contrib.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.svg
          git diff --cached --quiet || git commit -m "Update contribution animation"
          git push
